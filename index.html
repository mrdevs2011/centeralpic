<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>CenteralPIC</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M 100.44 100.44 A 220 220 0 1 1 100.44 411.56 L 142.86 369.14 A 160 160 0 1 0 142.86 142.86 Z M 340.85 171.15 A 120 120 0 1 0 340.85 340.85 L 298.43 298.43 A 60 60 0 1 1 298.43 213.57 Z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:none;overscroll-behavior:none}
.zone{width:100%;height:100%;position:relative;background:#0a0a0a;overflow:hidden;touch-action:none}
#canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto;z-index:3;display:block;touch-action:none;cursor:default;opacity:0;filter:blur(24px) brightness(.8);transition:opacity .15s linear,filter .6s cubic-bezier(.22,1,.36,1)}
#canvas.revealed{opacity:1;filter:blur(0) brightness(1)}
#canvas.clearing{opacity:0;filter:blur(16px) brightness(.7);transition:opacity .25s ease,filter .25s ease}
#fileInput{display:none}
.remote-cursor{position:absolute;pointer-events:none;z-index:25;opacity:0;will-change:transform;left:0;top:0;width:32px;height:32px;transform-origin:0 0;transition:opacity 150ms ease}
.remote-cursor.visible{opacity:1}
.remote-cursor svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 4px rgba(0,0,0,.85)) drop-shadow(0 0 8px currentColor)}
</style>
</head>
<body>
<div class="zone" id="zone">
  <input type="file" id="fileInput" accept="image/*">
  <canvas id="canvas"></canvas>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getDatabase, ref, set as rtdbSet, update as rtdbUpdate,
  onValue, onChildAdded, onChildRemoved, onDisconnect
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoyos6hb4yq8FKXRKAtpwERDh6agaF5VU",
  authDomain: "centeralpic.firebaseapp.com",
  projectId: "centeralpic",
  storageBucket: "centeralpic.firebasestorage.app",
  messagingSenderId: "294796721198",
  appId: "1:294796721198:web:ffb2bd139d31464687f3bf",
  databaseURL: "https://centeralpic-default-rtdb.europe-west1.firebasedatabase.app"
};
const ROOM = "centeralpic-main";
const MAX_FILE_BYTES = 800 * 1024;

const app = initializeApp(firebaseConfig);
const rtdb = getDatabase(app);
const imageRef = ref(rtdb, "image");
const strokesRoot = ref(rtdb, "strokes");

const $ = (id) => document.getElementById(id);
const zone = $("zone"), canvas = $("canvas");
const ctx = canvas.getContext("2d");
const fileInput = $("fileInput");

const COLORS = ["#ff0000", "#22c55e", "#3b82f6", "#eab308", "#ffffff", "#ec4899", "#f97316", "#a855f7"];
const LINE_WIDTHS = [2, 4, 6, 8, 12, 16, 24];
const state = { colorIndex: 0, widthIndex: 3, helpOpen: false };
const currentColor = () => COLORS[state.colorIndex];
const currentWidth = () => LINE_WIDTHS[state.widthIndex];

let currentSrc = "", localToken = 0;
const image = new Image();
image.crossOrigin = "anonymous";
let imageReady = false, imageMeta = null;

const view = { scale: 1, tx: 0, ty: 0 };
const MIN_SCALE = 0.25, MAX_SCALE = 16;
let isSpaceDown = false, isPanning = false;
let panStartPointer = { x: 0, y: 0 }, panStartView = { tx: 0, ty: 0 };
let lastSentX = 0, lastSentY = 0, lastPointerX = 0, lastPointerY = 0;

const myId = Math.random().toString(36).slice(2, 10);
const localSegments = new Map();
const remoteCursors = new Map();
const activePointers = new Map();
let isDrawing = false;
let pinchStartDist = 0, pinchStartScale = 1;
let pinchStartCenter = { x: 0, y: 0 }, pinchStartView = { tx: 0, ty: 0 };
let canvasW = 0, canvasH = 0, dpr = 1;
let lastDeleteTime = 0;
const DELETE_DOUBLE_MS = 500;

/* ---------- Transport: BroadcastChannel + WebRTC + RTDB ---------- */
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("centeralpic-" + ROOM) : null;
if (bc) bc.onmessage = (e) => {
  const msg = e.data;
  if (!msg || msg.from === myId) return;
  handleMessage(msg.from, msg);
};

const peers = new Map();
const handledSdp = new Set(), handledIce = new Set();
const ICE = { iceCandidatePoolSize: 4, iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  { urls: "stun:global.stun.twilio.com:3478" }
] };

function createPeer(remoteId, initiator) {
  if (peers.has(remoteId)) return peers.get(remoteId);
  const pc = new RTCPeerConnection(ICE);
  const entry = { pc, dc: null, connected: false, created: Date.now(), pend: [] };
  peers.set(remoteId, entry);
  pc.onicecandidate = (e) => {
    if (e.candidate) {
      const path = `signaling/${ROOM}/${remoteId}/ice/${myId}/${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      rtdbSet(ref(rtdb, path), e.candidate.toJSON()).catch(() => {});
    }
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "failed" || pc.connectionState === "closed") cleanupPeer(remoteId);
  };
  pc.ondatachannel = (e) => setupDataChannel(remoteId, e.channel);
  if (initiator) {
    setupDataChannel(remoteId, pc.createDataChannel("d"));
    setupDataChannel(remoteId, pc.createDataChannel("f", { ordered: false, maxRetransmits: 0 }));
    pc.createOffer()
      .then((offer) => pc.setLocalDescription(offer))
      .then(() => rtdbSet(ref(rtdb, `signaling/${ROOM}/${remoteId}/sdp/${myId}`),
        { type: pc.localDescription.type, sdp: pc.localDescription.sdp }).catch(() => {}))
      .catch(() => cleanupPeer(remoteId));
  }
  return entry;
}

function setupDataChannel(remoteId, dc) {
  const entry = peers.get(remoteId);
  if (!entry) return;
  if (dc.label === "f") entry.fc = dc; else entry.dc = dc;
  dc.onopen = () => { entry.connected = true; };
  dc.onclose = () => { if (dc.label !== "f") entry.connected = false; };
  dc.onmessage = (e) => { try { handleMessage(remoteId, JSON.parse(e.data)); } catch (err) {} };
}

function cleanupPeer(remoteId) {
  const entry = peers.get(remoteId);
  if (!entry) return;
  try { entry.dc && entry.dc.close(); } catch (e) {}
  try { entry.pc.close(); } catch (e) {}
  peers.delete(remoteId);
  rtdbSet(ref(rtdb, `signaling/${ROOM}/${remoteId}`), null).catch(() => {});
}

async function flushPendingIce(entry) {
  const list = entry.pend; entry.pend = [];
  for (const c of list) { try { await entry.pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {} }
}

async function handleRemoteSdp(fromId, sdp) {
  const key = fromId + ":" + sdp.type + ":" + (sdp.sdp || "").slice(0, 40);
  if (handledSdp.has(key)) return;
  handledSdp.add(key);
  const entry = peers.get(fromId) || createPeer(fromId, false);
  const pc = entry.pc;
  try {
    if (sdp.type === "offer") {
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      await flushPendingIce(entry);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await rtdbSet(ref(rtdb, `signaling/${ROOM}/${fromId}/sdp/${myId}`), { type: answer.type, sdp: answer.sdp });
    } else if (sdp.type === "answer" && pc.signalingState === "have-local-offer") {
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      await flushPendingIce(entry);
    }
  } catch (err) { console.error("SDP err", err); }
}

async function handleRemoteIce(fromId, cand, cid) {
  const key = fromId + ":" + cid;
  if (handledIce.has(key)) return;
  handledIce.add(key);
  const entry = peers.get(fromId) || createPeer(fromId, false);
  if (!entry.pc.remoteDescription) { entry.pend.push(cand); return; }
  try { await entry.pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (err) {}
}

onValue(ref(rtdb, `signaling/${ROOM}/${myId}`), (snap) => {
  const data = snap.val();
  if (!data) return;
  const sdpRoot = data.sdp || {};
  for (const fromId in sdpRoot) {
    const sdp = sdpRoot[fromId];
    if (fromId !== myId && sdp && sdp.type) handleRemoteSdp(fromId, sdp);
  }
  const iceRoot = data.ice || {};
  for (const fromId in iceRoot) {
    if (fromId === myId) continue;
    const cands = iceRoot[fromId] || {};
    for (const cid in cands) handleRemoteIce(fromId, cands[cid], cid);
  }
});

onChildAdded(ref(rtdb, `signaling/${ROOM}/peers`), (child) => {
  const otherId = child.key;
  if (otherId !== myId) createPeer(otherId, myId < otherId);
});

rtdbSet(ref(rtdb, `signaling/${ROOM}/peers/${myId}`), { t: Date.now() }).catch(() => {});
onDisconnect(ref(rtdb, `signaling/${ROOM}/peers/${myId}`)).remove();
onDisconnect(ref(rtdb, `signaling/${ROOM}/${myId}`)).remove();

setInterval(() => {
  const now = Date.now();
  for (const [id, e] of peers) if (!e.connected && now - e.created > 20000) cleanupPeer(id);
}, 5000);

/* RTDB strokes: sahifa ochilganda mavjudlarini yuklaydi + kafolatli sinxron */
onChildAdded(strokesRoot, (child) => {
  const s = child.val();
  if (!s || localSegments.has(child.key)) return;
  localSegments.set(child.key, s);
  redrawAll();
});
onChildRemoved(strokesRoot, (child) => {
  if (localSegments.delete(child.key)) redrawAll();
});

function send(msg) {
  msg.from = myId;
  if (bc) { try { bc.postMessage(msg); } catch (e) {} }
  if (!peers.size) return;
  const str = JSON.stringify(msg);
  const fast = msg.t === "p" || msg.t === "ping" || msg.t === "pong";
  for (const [, p] of peers) {
    const ch = fast && p.fc && p.fc.readyState === "open" ? p.fc : p.dc;
    if (ch && ch.readyState === "open") { try { ch.send(str); } catch (e) {} }
  }
}

function handleMessage(fromId, msg) {
  if (!msg || fromId === myId) return;
  switch (msg.t) {
    case "s": {
      const s = msg.s;
      if (!s || localSegments.has(s.id)) return;
      localSegments.set(s.id, s);
      drawSegmentNorm(s);
      break;
    }
    case "u":
      if (Array.isArray(msg.ids)) { for (const id of msg.ids) localSegments.delete(id); redrawAll(); }
      break;
    case "c":
      localSegments.clear(); redrawAll();
      break;
    case "v":
      if (Math.abs(msg.scale - view.scale) < 0.0005 && Math.abs(msg.tx - view.tx) < 0.5 && Math.abs(msg.ty - view.ty) < 0.5) return;
      view.scale = msg.scale; view.tx = msg.tx; view.ty = msg.ty;
      applyView();
      break;
    case "p": placeRemoteCursor(fromId, msg.x, msg.y); break;
    case "st": applyRemoteState(msg); break;
  }
}

/* Chizuvchining o'zi segmentlarni RTDB'ga yozadi */
let strokePersistQueue = [], strokePersistTimer = null;
function scheduleStrokePersist(s) {
  strokePersistQueue.push(s);
  if (!strokePersistTimer) strokePersistTimer = setTimeout(flushStrokePersist, 80);
}
async function flushStrokePersist() {
  strokePersistTimer = null;
  const batch = strokePersistQueue.splice(0);
  if (!batch.length) return;
  const updates = {};
  for (const s of batch) updates["strokes/" + s.id] = s;
  try { await rtdbUpdate(ref(rtdb), updates); } catch (e) {}
}


/* ---------- Geometry / view ---------- */
function getImageRect() {
  const nW = image.naturalWidth || 1, nH = image.naturalHeight || 1;
  const scale = Math.min(canvasW / nW, canvasH / nH);
  const w = nW * scale, h = nH * scale;
  return { left: (canvasW - w) / 2, top: (canvasH - h) / 2, width: w, height: h };
}
function screenToNorm(px, py) {
  const cx = (px - view.tx) / view.scale, cy = (py - view.ty) / view.scale;
  const r = getImageRect();
  return { x: (cx - r.left) / r.width, y: (cy - r.top) / r.height };
}
function normToScreen(nx, ny) {
  const r = getImageRect();
  return { x: (r.left + nx * r.width) * view.scale + view.tx, y: (r.top + ny * r.height) * view.scale + view.ty };
}

function applyView() {
  redrawAll();
  for (const [, c] of remoteCursors) {
    const p = normToScreen(c.nx, c.ny);
    c.el.style.transition = "none";
    c.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
    void c.el.offsetWidth;
    c.el.style.transition = "";
  }
}
function sendView() {
  send({ t: "v", scale: +view.scale.toFixed(4), tx: +view.tx.toFixed(2), ty: +view.ty.toFixed(2) });
}
function zoomAt(px, py, newScale, sync = true) {
  newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
  const cx = (px - view.tx) / view.scale, cy = (py - view.ty) / view.scale;
  view.scale = newScale;
  view.tx = px - cx * newScale;
  view.ty = py - cy * newScale;
  applyView();
  if (sync) sendView();
}
function resetView(sync = true) {
  view.scale = 1; view.tx = 0; view.ty = 0;
  applyView();
  if (sync) sendView();
}
function panBy(dx, dy, sync = true) {
  view.tx += dx; view.ty += dy;
  applyView();
  if (sync) sendView();
}

/* ---------- State (color, width, help) ---------- */
function broadcastState() { send({ t: "st", ci: state.colorIndex, wi: state.widthIndex }); }
function applyRemoteState(msg) {
  if (typeof msg.ci === "number") state.colorIndex = msg.ci;
  if (typeof msg.wi === "number") state.widthIndex = msg.wi;
}

/* ---------- Cursors ---------- */
const SVG_NS = "http://www.w3.org/2000/svg";
function makeCursorSvg() {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 512 512");
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", "100%");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  const path = document.createElementNS(SVG_NS, "path");
  path.setAttribute("d", "M 140 80 L 400 260 L 260 290 L 140 410 Z");
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", "32");
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);
  return svg;
}
function pickColor(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 360;
  return `hsl(${h}, 85%, 60%)`;
}
function ensureRemoteCursor(uid) {
  let c = remoteCursors.get(uid);
  if (c) return c;
  const color = pickColor(uid);
  const el = document.createElement("div");
  el.className = "remote-cursor";
  el.style.color = color;
  el.appendChild(makeCursorSvg());
  zone.appendChild(el);
  c = { el, nx: 0, ny: 0, t: 0 };
  remoteCursors.set(uid, c);
  return c;
}
function placeRemoteCursor(uid, nx, ny) {
  const c = ensureRemoteCursor(uid);
  c.nx = nx; c.ny = ny; c.t = Date.now();
  const p = normToScreen(nx, ny);
  c.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
  c.el.classList.add("visible");
}
setInterval(() => {
  const now = Date.now();
  for (const [uid, c] of remoteCursors) {
    if (now - c.t > 5000) { c.el.remove(); remoteCursors.delete(uid); }
  }
}, 2000);

/* ---------- Draw ---------- */
function drawImage() {
  if (!imageReady) return;
  const r = getImageRect();
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, canvasW, canvasH);
  ctx.clip();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(image, r.left * view.scale + view.tx, r.top * view.scale + view.ty, r.width * view.scale, r.height * view.scale);
  ctx.restore();
}
function strokeLine(a, b, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width * view.scale;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}
function drawSegmentNorm(s) {
  strokeLine(normToScreen(s.x0, s.y0), normToScreen(s.x1, s.y1), s.c, s.w);
}
let redrawQueued = false;
function redrawAll() {
  if (redrawQueued) return;
  redrawQueued = true;
  requestAnimationFrame(() => { redrawQueued = false; doRedraw(); });
}
function doRedraw() {
  ctx.clearRect(0, 0, canvasW, canvasH);
  drawImage();
  for (const s of localSegments.values()) drawSegmentNorm(s);
}

/* ---------- Image (RTDB: /image) ---------- */
function showImage(src) {
  if (!src) {
    imageReady = false; currentSrc = ""; imageMeta = null;
    zone.classList.remove("has-image");
    canvas.classList.remove("revealed");
    canvas.classList.add("clearing");
    setTimeout(() => {
      if (!imageReady) { canvas.classList.remove("revealed", "clearing"); redrawAll(); }
    }, 300);
    return;
  }
  if (src === currentSrc && imageReady) return;
  canvas.classList.remove("revealed", "clearing");
  imageReady = false;
  currentSrc = src;
  image.onload = () => {
    imageReady = true;
    zone.classList.add("has-image");
    applyView();
    requestAnimationFrame(() => requestAnimationFrame(() => canvas.classList.add("revealed")));
  };
  image.onerror = () => { imageReady = false; redrawAll(); };
  image.src = src;
}

onValue(imageRef, (snap) => {
  const data = snap.val();
  if (!data || !data.base64) { showImage(""); return; }
  imageMeta = { name: data.name, size: data.size, type: data.type };
  if (data.base64 === currentSrc && imageReady) return;
  showImage(data.base64);
}, (err) => console.error(err));

/* ---------- Pointer ---------- */
function getPinchCenter() {
  const p = Array.from(activePointers.values());
  return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
}
function getPinchDist() {
  const p = Array.from(activePointers.values());
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
}

function onPointerDown(e) {
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  activePointers.set(e.pointerId, { x: px, y: py });

  if (isSpaceDown || e.button === 1) {
    isPanning = true; isDrawing = false;
    panStartPointer = { x: px, y: py };
    panStartView = { tx: view.tx, ty: view.ty };
    canvas.classList.add("panning");
    return;
  }
  if (activePointers.size === 1) {
    isDrawing = true;
    const n = screenToNorm(px, py);
    lastSentX = n.x; lastSentY = n.y; lastPointerX = n.x; lastPointerY = n.y;
    send({ t: "p", x: n.x, y: n.y });
  } else if (activePointers.size === 2) {
    isDrawing = false; isPanning = true;
    pinchStartDist = getPinchDist();
    pinchStartScale = view.scale;
    pinchStartCenter = getPinchCenter();
    pinchStartView = { tx: view.tx, ty: view.ty };
  }
}

function onPointerMove(e) {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;

  if (!activePointers.has(e.pointerId)) {
    const n = screenToNorm(px, py);
    send({ t: "p", x: n.x, y: n.y });
    return;
  }
  activePointers.set(e.pointerId, { x: px, y: py });

  if (isPanning && activePointers.size === 1) {
    view.tx = panStartView.tx + (px - panStartPointer.x);
    view.ty = panStartView.ty + (py - panStartPointer.y);
    applyView();
    sendView();
    return;
  }

  if (activePointers.size >= 2) {
    if (pinchStartDist > 0) {
      const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale * getPinchDist() / pinchStartDist));
      const center = getPinchCenter();
      const cx = (pinchStartCenter.x - pinchStartView.tx) / pinchStartScale;
      const cy = (pinchStartCenter.y - pinchStartView.ty) / pinchStartScale;
      view.scale = newScale;
      view.tx = center.x - cx * newScale;
      view.ty = center.y - cy * newScale;
      applyView();
      sendView();
    }
    return;
  }

  if (activePointers.size === 1 && isDrawing) {
    const n = screenToNorm(px, py);
    send({ t: "p", x: n.x, y: n.y });

    const r = getImageRect();
    const dxPx = (n.x - lastPointerX) * r.width * view.scale;
    const dyPx = (n.y - lastPointerY) * r.height * view.scale;
    if (dxPx * dxPx + dyPx * dyPx < 4) return;

    strokeLine(normToScreen(lastPointerX, lastPointerY), normToScreen(n.x, n.y), currentColor(), currentWidth());

    const id = "s_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6);
    const s = {
      id,
      x0: +lastSentX.toFixed(4), y0: +lastSentY.toFixed(4),
      x1: +n.x.toFixed(4), y1: +n.y.toFixed(4),
      c: currentColor(), w: currentWidth(), u: myId, t: Date.now()
    };
    localSegments.set(id, s);
    send({ t: "s", s });
    scheduleStrokePersist(s);

    lastPointerX = n.x; lastPointerY = n.y;
    lastSentX = n.x; lastSentY = n.y;
  }
}

function onPointerUp(e) {
  activePointers.delete(e.pointerId);
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  if (activePointers.size <= 1) { isDrawing = false; isPanning = false; pinchStartDist = 0; }
  if (activePointers.size === 0) canvas.classList.remove("panning");
}

function onWheel(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  if (e.ctrlKey) zoomAt(px, py, view.scale * Math.exp(-e.deltaY * 0.01));
  else panBy(-e.deltaX, -e.deltaY);
}

/* ---------- Undo / clear ---------- */
function globalUndo() {
  const arr = Array.from(localSegments.values()).sort((x, y) => (x.t || 0) - (y.t || 0));
  if (!arr.length) return;
  const last = arr[arr.length - 1];
  const cutoff = (last.t || Date.now()) - 700;
  const ids = [last.id];
  for (let i = arr.length - 2; i >= 0; i--) {
    const x = arr[i];
    if (x.u !== last.u || (x.t || 0) < cutoff) break;
    ids.push(x.id);
  }
  const set = new Set(ids);
  for (const id of ids) localSegments.delete(id);
  strokePersistQueue = strokePersistQueue.filter((x) => !set.has(x.id));
  redrawAll();
  send({ t: "u", ids });
  const updates = {};
  for (const id of ids) updates["strokes/" + id] = null;
  rtdbUpdate(ref(rtdb), updates).catch(() => {});
}

function clearStrokes() {
  strokePersistQueue = [];
  if (strokePersistTimer) { clearTimeout(strokePersistTimer); strokePersistTimer = null; }
  localSegments.clear();
  redrawAll();
  send({ t: "c" });
  rtdbSet(strokesRoot, null).catch(() => {});
}

async function clearImage() {
  try { await rtdbSet(imageRef, null); } catch (e) {}
  clearStrokes();
  resetView(true);
}

/* ---------- Helpers ---------- */
const showStatus = () => {};
const setLoader = () => {};
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ---------- Upload (RTDB: /image) ---------- */
async function uploadOne(file) {
  if (!file || !file.type || !file.type.startsWith("image/")) { showStatus("Only images", true); return; }
  if (file.size > MAX_FILE_BYTES) { showStatus("Max 800 KB", true); return; }
  const token = ++localToken;
  const prevSrc = currentSrc;
  try {
    setLoader(true);
    const base64 = await fileToBase64(file);
    showImage(base64);
    await rtdbSet(imageRef, {
      base64,
      name: file.name || "paste-" + Date.now() + ".png",
      type: file.type,
      size: file.size,
      t: Date.now()
    });
    imageMeta = { name: file.name || "pasted", size: file.size };
    clearStrokes();
    resetView(true);
    if (token === localToken) { setLoader(false); showStatus("Saved"); }
  } catch (err) {
    console.error(err);
    if (token === localToken) {
      setLoader(false);
      showStatus(err.message || "Error", true);
      if (prevSrc) showImage(prevSrc);
    }
  }
}

function downloadImage() {
  if (!imageReady) { showStatus("No image", true); return; }
  const a = document.createElement("a");
  a.href = currentSrc;
  a.download = (imageMeta && imageMeta.name) || "CenteralPIC.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
  showStatus("Downloaded");
}
function showImageInfo() {
  if (!imageReady) { showStatus("No image", true); return; }
  const size = imageMeta && imageMeta.size ? Math.round(imageMeta.size / 1024) + " KB" : "—";
  const name = (imageMeta && imageMeta.name) || "pasted";
  showStatus(`${name} · ${image.naturalWidth}×${image.naturalHeight} · ${size} · ${Math.round(view.scale * 100)}%`);
}

function resizeCanvas() {
  const r = zone.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvasW = r.width; canvasH = r.height;
  canvas.width = Math.floor(canvasW * dpr);
  canvas.height = Math.floor(canvasH * dpr);
  canvas.style.width = canvasW + "px";
  canvas.style.height = canvasH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  applyView();
}

/* ---------- Events ---------- */
zone.addEventListener("dragover", (e) => e.preventDefault());
zone.addEventListener("drop", (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) uploadOne(f);
});
document.addEventListener("paste", (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith("image/")) {
      e.preventDefault();
      const f = item.getAsFile();
      if (f) uploadOne(f);
      return;
    }
  }
});

canvas.addEventListener("pointerdown", onPointerDown);
canvas.addEventListener("pointermove", onPointerMove);
canvas.addEventListener("pointerup", onPointerUp);
canvas.addEventListener("pointercancel", onPointerUp);
canvas.addEventListener("wheel", onWheel, { passive: false });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
["gesturestart", "gesturechange", "gestureend"].forEach((ev) => {
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
});
window.addEventListener("resize", resizeCanvas);
window.addEventListener("beforeunload", () => { if (bc) bc.close(); });

document.addEventListener("keydown", (e) => {
  const t = document.activeElement && document.activeElement.tagName;
  if (t === "INPUT" || t === "TEXTAREA") {
    if (e.key === "Escape") document.activeElement.blur();
    return;
  }
  const cmd = e.ctrlKey || e.metaKey;
  const k = e.key;
  const cx = canvasW / 2, cy = canvasH / 2;

  if (k === "Escape") { isDrawing = false; return; }
  if (k === " ") { isSpaceDown = true; canvas.classList.add("panning"); e.preventDefault(); return; }
  if (cmd && (k === "z" || k === "Z") && !e.shiftKey) { e.preventDefault(); globalUndo(); return; }
  if (cmd && k === "0") { e.preventDefault(); resetView(true); return; }
  if (cmd && (k === "+" || k === "=")) { e.preventDefault(); zoomAt(cx, cy, view.scale * 1.25); return; }
  if (cmd && (k === "-" || k === "_")) { e.preventDefault(); zoomAt(cx, cy, view.scale / 1.25); return; }
  if (k === "Delete") {
    e.preventDefault();
    const now = Date.now();
    if (now - lastDeleteTime < DELETE_DOUBLE_MS) { lastDeleteTime = 0; clearImage(); }
    else { lastDeleteTime = now; showStatus("Press Delete again to clear"); }
    return;
  }
  if (k === "Backspace") { e.preventDefault(); globalUndo(); return; }
  if (!cmd && (k === "c" || k === "C")) { e.preventDefault(); clearStrokes(); return; }
  if (!cmd && (k === "e" || k === "E")) {
    e.preventDefault();
    state.colorIndex = (state.colorIndex + 1) % COLORS.length;
    broadcastState();
    showStatus("Color: " + currentColor());
    return;
  }
  if (k === "[") {
    e.preventDefault();
    state.widthIndex = Math.max(0, state.widthIndex - 1);
    broadcastState();
    showStatus("Width: " + currentWidth());
    return;
  }
  if (k === "]") {
    e.preventDefault();
    state.widthIndex = Math.min(LINE_WIDTHS.length - 1, state.widthIndex + 1);
    broadcastState();
    showStatus("Width: " + currentWidth());
    return;
  }
  if (!cmd && (k === "o" || k === "O")) { e.preventDefault(); fileInput.click(); return; }
  if (!cmd && (k === "s" || k === "S")) { e.preventDefault(); downloadImage(); return; }
  if (!cmd && (k === "i" || k === "I")) { e.preventDefault(); showImageInfo(); return; }
  if (!cmd && (k === "f" || k === "F")) {
    e.preventDefault();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen().catch(() => {});
    return;
  }
  if (k === "1") { e.preventDefault(); resetView(true); return; }
  if (k === "2") { e.preventDefault(); zoomAt(cx, cy, 2); return; }

  const step = e.shiftKey ? 100 : 30;
  if (k === "ArrowLeft") { e.preventDefault(); panBy(step, 0); return; }
  if (k === "ArrowRight") { e.preventDefault(); panBy(-step, 0); return; }
  if (k === "ArrowUp") { e.preventDefault(); panBy(0, step); return; }
  if (k === "ArrowDown") { e.preventDefault(); panBy(0, -step); return; }
});
document.addEventListener("keyup", (e) => {
  if (e.key === " ") { isSpaceDown = false; canvas.classList.remove("panning"); }
});
window.addEventListener("blur", () => { isSpaceDown = false; canvas.classList.remove("panning"); });

fileInput.addEventListener("change", () => {
  const f = fileInput.files[0];
  if (f) uploadOne(f);
  fileInput.value = "";
});

resizeCanvas();
</script>
</body>
</html>
