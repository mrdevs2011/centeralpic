<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .zone {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: default;
    }

    .zone.dragover {
      background: #f8fafc;
    }

    .zone.has-image {
      background: #000;
    }

    #preview {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: none;
    }

    .zone.has-image #preview {
      display: block;
    }

    .hint {
      color: #94a3b8;
      font-size: 0.95rem;
      position: absolute;
      pointer-events: none;
    }

    .zone.has-image .hint {
      display: none;
    }

    #fileInput { display: none; }

    .status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      background: #f1f5f9;
      color: #334155;
      display: none;
      z-index: 10;
    }

    .status.show { display: block; }
    .status.error { background: #fef2f2; color: #b91c1c; }
  </style>
</head>
<body>
  <div class="zone" id="zone">
    <p class="hint" id="hint">Drop or Ctrl+V</p>
    <img id="preview" src="" alt="">
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <div class="status" id="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      setDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCcimoiLZArgPYiOxA265mSf1svsk_ZJwA",
      authDomain: "centeral-place.firebaseapp.com",
      projectId: "centeral-place",
      storageBucket: "centeral-place.firebasestorage.app",
      messagingSenderId: "405215574357",
      appId: "1:405215574357:web:ede39d7a2a51b5540e17dc",
      measurementId: "G-EYWES5G5K8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Bitta document — butun app uchun bitta rasm
    const imageRef = doc(db, "app", "mainImage");

    const zone = document.getElementById("zone");
    const preview = document.getElementById("preview");
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const hint = document.getElementById("hint");

    function showStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = "status show" + (isError ? " error" : "");
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => {
        statusEl.className = "status";
      }, 2000);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadOne(file) {
      if (!file || !file.type || !file.type.startsWith("image/")) {
        showStatus("Only images", true);
        return;
      }
      if (file.size > 800 * 1024) {
        showStatus("Max 800 KB", true);
        return;
      }
      try {
        showStatus("Uploading...");
        const base64 = await fileToBase64(file);
        await setDoc(imageRef, {
          base64,
          name: file.name || "paste-" + Date.now() + ".png",
          type: file.type,
          size: file.size,
          updatedAt: serverTimestamp()
        });
        showStatus("Saved");
      } catch (err) {
        console.error(err);
        showStatus(err.message || "Error", true);
      }
    }

    // Drag & drop
    zone.addEventListener("dragover", (e) => {
      e.preventDefault();
      zone.classList.add("dragover");
    });
    zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("dragover");
      const f = e.dataTransfer.files[0];
      if (f) uploadOne(f);
    });

    // Ctrl+V
    document.addEventListener("paste", (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          e.preventDefault();
          const f = item.getAsFile();
          if (f) uploadOne(f);
          return;
        }
      }
    });

    // Realtime — bitta rasm
    onSnapshot(imageRef, (snap) => {
      if (snap.exists() && snap.data().base64) {
        preview.src = snap.data().base64;
        zone.classList.add("has-image");
      } else {
        preview.src = "";
        zone.classList.remove("has-image");
      }
    }, (err) => {
      console.error(err);
      showStatus("Firestore error — check Rules", true);
    });
  </script>
</body>
</html>
