<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>CenteralPic</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    .zone {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      overflow: hidden;
      touch-action: none;
    }
    .zone.dragover { background: #141414; }
    .zone.dragover::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px dashed #404040;
      border-radius: 12px;
      pointer-events: none;
      z-index: 2;
      animation: pulseBorder 1s ease-in-out infinite;
    }
    @keyframes pulseBorder {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 0;
      filter: blur(32px) brightness(0.8);
      transform: scale(1.04);
      transition:
        opacity 0.08s linear,
        filter 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, filter, transform;
    }
    #preview.blur-in {
      opacity: 1;
      filter: blur(32px) brightness(0.8);
      transform: scale(1.04);
    }
    #preview.sharp {
      opacity: 1;
      filter: blur(0) brightness(1);
      transform: scale(1);
    }
    #preview.leaving {
      opacity: 0;
      filter: blur(20px);
      transform: scale(1.02);
      transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease;
    }
    .hint {
      color: #525252;
      font-size: 0.95rem;
      z-index: 1;
      pointer-events: none;
      letter-spacing: 0.02em;
      transition: opacity 0.25s ease, color 0.2s ease;
      text-align: center;
      line-height: 1.6;
    }
    .zone.has-image .hint { opacity: 0; }
    .zone.dragover .hint { color: #a3a3a3; }
    .loader {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #333, #bbb, #333);
      background-size: 200% 100%;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .loader.active {
      opacity: 1;
      width: 100%;
      animation: shimmer 0.8s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    #fileInput { display: none; }
    .status {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      background: #1a1a1a;
      color: #d4d4d4;
      border: 1px solid #333;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10;
      pointer-events: none;
    }
    .status.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .status.error {
      background: #1c1010;
      color: #f87171;
      border-color: #7f1d1d;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      z-index: 3;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .remote-cursor {
      position: absolute;
      pointer-events: none;
      z-index: 25;
      transition: opacity 200ms ease;
      opacity: 0;
      will-change: transform;
      left: 0;
      top: 0;
    }
    .remote-cursor.visible { opacity: 1; }
    .remote-cursor .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.55), 0 0 12px currentColor;
      transform: translate(-50%, -50%);
      background: currentColor;
    }
    .remote-cursor .label {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      white-space: nowrap;
      font-family: ui-monospace, monospace;
      letter-spacing: 0.02em;
      border: 1px solid currentColor;
    }

    .zoom-controls {
      position: fixed;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 40;
    }
    .zoom-controls button {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #1a1a1a;
      color: #d4d4d4;
      border: 1px solid #333;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-controls button:active { background: #262626; }
    .zoom-badge {
      position: fixed;
      top: 14px;
      left: 14px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(20,20,20,0.8);
      color: #a3a3a3;
      border: 1px solid #333;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      z-index: 40;
      user-select: none;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .zoom-badge.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="zone" id="zone">
    <p class="hint">Drop or Ctrl+V<br>Ctrl+Z — undo · pinch / scroll — zoom</p>
    <img id="preview" src="" alt="">
    <input type="file" id="fileInput" accept="image/*">
    <canvas id="canvas"></canvas>
  </div>

  <div class="zoom-controls">
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomReset" title="Reset">⌂</button>
  </div>
  <div class="zoom-badge" id="zoomBadge">100%</div>

  <div class="loader" id="loader"></div>
  <div class="status" id="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      setDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
    import {
      getDatabase,
      ref,
      push,
      remove,
      onChildAdded,
      onChildRemoved,
      onValue,
      onDisconnect,
      query,
      limitToLast,
      get,
      set as rtdbSet,
      update as rtdbUpdate
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBoyos6hb4yq8FKXRKAtpwERDh6agaF5VU",
      authDomain: "centeralpic.firebaseapp.com",
      projectId: "centeralpic",
      storageBucket: "centeralpic.firebasestorage.app",
      messagingSenderId: "294796721198",
      appId: "1:294796721198:web:ffb2bd139d31464687f3bf",
      databaseURL: "https://centeralpic-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);
    const imageRef = doc(db, "app", "mainImage");
    const strokesRoot = ref(rtdb, "strokes");
    const cursorsRoot = ref(rtdb, "cursors");

    const zone = document.getElementById("zone");
    const preview = document.getElementById("preview");
    const statusEl = document.getElementById("status");
    const loader = document.getElementById("loader");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const zoomBadge = document.getElementById("zoomBadge");

    let currentSrc = "";
    let localToken = 0;
    const lineWidth = 8;
    const currentColor = "#ff0000";

    // ---- viewport ----
    const view = { scale: 1, tx: 0, ty: 0 };
    const MIN_SCALE = 0.5;
    const MAX_SCALE = 8;

    // ---- stroke holati (normalized 0..1) ----
    let lastSentX = 0;
    let lastSentY = 0;
    let lastPointerX = 0;
    let lastPointerY = 0;

    const myId = Math.random().toString(36).slice(2, 10);
    const localSegments = new Map();
    const myStrokeIds = [];
    const undoStack = [];
    const MAX_UNDO = 100;

    // ---- cursor sync ----
    const myCursorRef = ref(rtdb, "cursors/" + myId);
    const remoteCursors = new Map();
    let lastCursorSend = 0;
    const CURSOR_SEND_INTERVAL = 40;

    // ---- pointer tracking ----
    const activePointers = new Map();
    let isDrawing = false;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let pinchStartCenter = { x: 0, y: 0 };
    let pinchStartView = { tx: 0, ty: 0 };

    function getImageRect() {
      const zoneRect = zone.getBoundingClientRect();
      const zW = zoneRect.width;
      const zH = zoneRect.height;
      const nW = preview.naturalWidth || 1;
      const nH = preview.naturalHeight || 1;
      const scale = Math.min(zW / nW, zH / nH);
      const w = nW * scale;
      const h = nH * scale;
      const left = (zW - w) / 2;
      const top = (zH - h) / 2;
      return { left, top, width: w, height: h };
    }

    function screenToNorm(px, py) {
      const cx = (px - view.tx) / view.scale;
      const cy = (py - view.ty) / view.scale;
      const r = getImageRect();
      return {
        x: (cx - r.left) / r.width,
        y: (cy - r.top) / r.height
      };
    }

    function normToScreen(nx, ny) {
      const r = getImageRect();
      const cx = r.left + nx * r.width;
      const cy = r.top + ny * r.height;
      return {
        x: cx * view.scale + view.tx,
        y: cy * view.scale + view.ty
      };
    }

    function applyView() {
      redrawAll();
      for (const [uid, c] of remoteCursors) {
        const p = normToScreen(c.nx, c.ny);
        c.el.style.transition = "none";
        c.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
        void c.el.offsetWidth;
        c.el.style.transition = "";
      }
      showZoomBadge();
    }

    function showZoomBadge() {
      zoomBadge.textContent = Math.round(view.scale * 100) + "%";
      zoomBadge.classList.add("show");
      clearTimeout(showZoomBadge._t);
      showZoomBadge._t = setTimeout(() => zoomBadge.classList.remove("show"), 1200);
    }

    function zoomAt(px, py, newScale) {
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      const cx = (px - view.tx) / view.scale;
      const cy = (py - view.ty) / view.scale;
      view.scale = newScale;
      view.tx = px - cx * newScale;
      view.ty = py - cy * newScale;
      applyView();
    }

    function resetView() {
      view.scale = 1;
      view.tx = 0;
      view.ty = 0;
      applyView();
    }

    function pickColor(seed) {
      let h = 0;
      for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 360;
      return `hsl(${h}, 85%, 60%)`;
    }

    function showStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = "status show" + (isError ? " error" : "");
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => { statusEl.className = "status"; }, 1500);
    }

    function setLoader(on) {
      loader.classList.toggle("active", !!on);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function showImage(src) {
      if (!src) {
        preview.classList.remove("sharp", "blur-in");
        preview.classList.add("leaving");
        setTimeout(() => {
          preview.src = "";
          preview.classList.remove("leaving");
          zone.classList.remove("has-image");
          currentSrc = "";
        }, 200);
        return;
      }
      if (src === currentSrc) return;
      const reveal = () => {
        preview.src = src;
        currentSrc = src;
        zone.classList.add("has-image");
        preview.classList.remove("leaving", "sharp");
        preview.classList.add("blur-in");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            preview.classList.add("sharp");
          });
        });
      };
      if (preview.classList.contains("sharp") || preview.classList.contains("blur-in")) {
        preview.classList.remove("sharp", "blur-in");
        preview.classList.add("leaving");
        setTimeout(reveal, 180);
      } else {
        reveal();
      }
    }

    function drawSegmentNorm(s) {
      const a = normToScreen(s.x0, s.y0);
      const b = normToScreen(s.x1, s.y1);
      ctx.strokeStyle = s.c;
      ctx.lineWidth = s.w * view.scale;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    function redrawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of localSegments.values()) drawSegmentNorm(s);
    }

    function sendCursor(nx, ny) {
      const now = performance.now();
      if (now - lastCursorSend < CURSOR_SEND_INTERVAL) return;
      lastCursorSend = now;
      rtdbUpdate(myCursorRef, {
        x: +nx.toFixed(4),
        y: +ny.toFixed(4),
        t: Date.now()
      }).catch(() => {});
    }

    function ensureRemoteCursor(uid) {
      let c = remoteCursors.get(uid);
      if (c) return c;
      const color = pickColor(uid);
      const el = document.createElement("div");
      el.className = "remote-cursor";
      el.style.color = color;

      const dot = document.createElement("div");
      dot.className = "dot";
      dot.style.color = color;
      dot.style.background = color;
      el.appendChild(dot);

      const label = document.createElement("div");
      label.className = "label";
      label.style.color = color;
      label.textContent = uid;
      el.appendChild(label);

      zone.appendChild(el);
      c = { el, dotEl: dot, labelEl: label, nx: 0, ny: 0, t: 0 };
      remoteCursors.set(uid, c);
      return c;
    }

    function placeRemoteCursor(uid, nx, ny, t) {
      const c = ensureRemoteCursor(uid);
      c.nx = nx; c.ny = ny; c.t = t;
      const p = normToScreen(nx, ny);
      c.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      c.el.classList.add("visible");
    }

    function removeRemoteCursor(uid) {
      const c = remoteCursors.get(uid);
      if (!c) return;
      c.el.remove();
      remoteCursors.delete(uid);
    }

    onValue(cursorsRoot, (snap) => {
      const data = snap.val() || {};
      for (const uid in data) {
        if (uid === myId) continue;
        const v = data[uid];
        if (!v) continue;
        placeRemoteCursor(uid, v.x, v.y, v.t);
      }
      for (const uid of Array.from(remoteCursors.keys())) {
        if (!data[uid]) removeRemoteCursor(uid);
      }
    });

    setInterval(() => {
      const now = Date.now();
      for (const [uid, c] of remoteCursors) {
        if (now - c.t > 5000) removeRemoteCursor(uid);
      }
    }, 2000);

    onDisconnect(myCursorRef).remove().catch(() => {});
    window.addEventListener("beforeunload", () => {
      try { remove(myCursorRef); } catch (e) {}
    });

    function getPinchCenter() {
      const pts = Array.from(activePointers.values());
      const x = (pts[0].x + pts[1].x) / 2;
      const y = (pts[0].y + pts[1].y) / 2;
      return { x, y };
    }

    function getPinchDist() {
      const pts = Array.from(activePointers.values());
      const dx = pts[0].x - pts[1].x;
      const dy = pts[0].y - pts[1].y;
      return Math.hypot(dx, dy);
    }

    function onPointerDown(e) {
      canvas.setPointerCapture(e.pointerId).catch(() => {});
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      activePointers.set(e.pointerId, { x: px, y: py });

      if (activePointers.size === 1) {
        isDrawing = true;
        const n = screenToNorm(px, py);
        lastSentX = n.x;
        lastSentY = n.y;
        lastPointerX = n.x;
        lastPointerY = n.y;
        sendCursor(n.x, n.y);
      } else if (activePointers.size === 2) {
        isDrawing = false;
        pinchStartDist = getPinchDist();
        pinchStartScale = view.scale;
        pinchStartCenter = getPinchCenter();
        pinchStartView = { tx: view.tx, ty: view.ty };
      }
    }

    function onPointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;

      if (!activePointers.has(e.pointerId)) {
        const n = screenToNorm(px, py);
        sendCursor(n.x, n.y);
        return;
      }
      activePointers.set(e.pointerId, { x: px, y: py });

      if (activePointers.size >= 2) {
        const dist = getPinchDist();
        if (pinchStartDist > 0) {
          const ratio = dist / pinchStartDist;
          let newScale = pinchStartScale * ratio;
          newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));

          const center = getPinchCenter();
          const cx = (pinchStartCenter.x - pinchStartView.tx) / pinchStartScale;
          const cy = (pinchStartCenter.y - pinchStartView.ty) / pinchStartScale;
          view.scale = newScale;
          view.tx = center.x - cx * newScale;
          view.ty = center.y - cy * newScale;
          applyView();
        }
        return;
      }

      if (activePointers.size === 1 && isDrawing) {
        const n = screenToNorm(px, py);
        sendCursor(n.x, n.y);

        const r = getImageRect();
        const dxPx = (n.x - lastPointerX) * r.width * view.scale;
        const dyPx = (n.y - lastPointerY) * r.height * view.scale;
        if (dxPx * dxPx + dyPx * dyPx < 4) return;

        const a = normToScreen(lastPointerX, lastPointerY);
        const b = normToScreen(n.x, n.y);
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = lineWidth * view.scale;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();

        const segRef = push(strokesRoot);
        const id = segRef.key;
        const payload = {
          x0: +lastSentX.toFixed(4),
          y0: +lastSentY.toFixed(4),
          x1: +n.x.toFixed(4),
          y1: +n.y.toFixed(4),
          c: currentColor,
          w: lineWidth,
          u: myId,
          t: Date.now()
        };
        localSegments.set(id, payload);
        myStrokeIds.push(id);
        addToUndoBatch(id);
        rtdbSet(segRef, payload).catch((err) => {
          console.error("push failed", err);
        });

        lastPointerX = n.x;
        lastPointerY = n.y;
        lastSentX = n.x;
        lastSentY = n.y;
      }
    }

    function onPointerUp(e) {
      activePointers.delete(e.pointerId);
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}

      if (activePointers.size === 0) {
        isDrawing = false;
        pinchStartDist = 0;
      } else if (activePointers.size === 1) {
        isDrawing = false;
        pinchStartDist = 0;
      }
    }

    function onWheel(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      const factor = Math.exp(-e.deltaY * 0.0015);
      zoomAt(px, py, view.scale * factor);
    }

    document.getElementById("zoomIn").addEventListener("click", () => {
      const rect = canvas.getBoundingClientRect();
      zoomAt(rect.width / 2, rect.height / 2, view.scale * 1.25);
    });
    document.getElementById("zoomOut").addEventListener("click", () => {
      const rect = canvas.getBoundingClientRect();
      zoomAt(rect.width / 2, rect.height / 2, view.scale / 1.25);
    });
    document.getElementById("zoomReset").addEventListener("click", resetView);

    function addToUndoBatch(id) {
      const now = Date.now();
      const last = undoStack[undoStack.length - 1];
      if (last && now - last.ts < 700) {
        last.ids.push(id);
        last.ts = now;
      } else {
        undoStack.push({ ids: [id], ts: now });
        if (undoStack.length > MAX_UNDO) undoStack.shift();
      }
    }

    async function undoMyLastBatch() {
      if (!undoStack.length) {
        showStatus("Nothing to undo");
        return;
      }
      const batch = undoStack.pop();
      const idsToRemove = batch.ids.filter((id) => {
        const seg = localSegments.get(id);
        return seg && seg.u === myId;
      });

      if (!idsToRemove.length) {
        showStatus("Nothing to undo");
        return;
      }

      for (const id of idsToRemove) {
        localSegments.delete(id);
        const idx = myStrokeIds.indexOf(id);
        if (idx !== -1) myStrokeIds.splice(idx, 1);
        remove(ref(rtdb, "strokes/" + id)).catch((err) => {
          console.error("remove failed", err);
        });
      }
      redrawAll();
      showStatus("Undone");
    }

    document.addEventListener("keydown", (e) => {
      const isUndo = (e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z";
      if (isUndo) {
        e.preventDefault();
        undoMyLastBatch();
        return;
      }
      const k = e.key;
      if (k === "0") resetView();
      if (k === "+" || k === "=") {
        const rect = canvas.getBoundingClientRect();
        zoomAt(rect.width / 2, rect.height / 2, view.scale * 1.25);
      }
      if (k === "-" || k === "_") {
        const rect = canvas.getBoundingClientRect();
        zoomAt(rect.width / 2, rect.height / 2, view.scale / 1.25);
      }
    });

    (async () => {
      try {
        const q = query(strokesRoot, limitToLast(5000));
        const snap = await get(q);
        if (snap.exists()) {
          snap.forEach((child) => {
            const s = child.val();
            if (!s) return;
            localSegments.set(child.key, s);
            if (s.u === myId) myStrokeIds.push(child.key);
          });
          redrawAll();
        }
      } catch (e) {
        console.error("initial load failed", e);
      }
    })();

    onChildAdded(strokesRoot, (child) => {
      const id = child.key;
      if (localSegments.has(id)) return;
      const s = child.val();
      if (!s) return;
      localSegments.set(id, s);
      drawSegmentNorm(s);
      if (s.u === myId) myStrokeIds.push(id);
    });

    onChildRemoved(strokesRoot, (child) => {
      const id = child.key;
      if (!localSegments.has(id)) return;
      localSegments.delete(id);
      const idx = myStrokeIds.indexOf(id);
      if (idx !== -1) myStrokeIds.splice(idx, 1);
      redrawAll();
    });

    async function uploadOne(file) {
      if (!file || !file.type || !file.type.startsWith("image/")) {
        showStatus("Only images", true);
        return;
      }
      if (file.size > 800 * 1024) {
        showStatus("Max 800 KB", true);
        return;
      }
      const token = ++localToken;
      try {
        setLoader(true);
        const base64 = await fileToBase64(file);
        showImage(base64);
        await setDoc(imageRef, {
          base64,
          name: file.name || "paste-" + Date.now() + ".png",
          type: file.type,
          size: file.size,
          updatedAt: serverTimestamp(),
          t: Date.now()
        });

        localSegments.clear();
        myStrokeIds.length = 0;
        undoStack.length = 0;
        resetView();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        await rtdbSet(strokesRoot, null);

        if (token === localToken) {
          setLoader(false);
          showStatus("Saved");
        }
      } catch (err) {
        console.error(err);
        if (token === localToken) {
          setLoader(false);
          showStatus(err.message || "Error", true);
        }
      }
    }

    function resizeCanvas() {
      const zoneRect = zone.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(zoneRect.width * dpr);
      canvas.height = Math.floor(zoneRect.height * dpr);
      canvas.style.width = zoneRect.width + "px";
      canvas.style.height = zoneRect.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      applyView();
    }

    zone.addEventListener("dragover", (e) => {
      e.preventDefault();
      zone.classList.add("dragover");
    });
    zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("dragover");
      const f = e.dataTransfer.files[0];
      if (f) uploadOne(f);
    });
    document.addEventListener("paste", (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          e.preventDefault();
          const f = item.getAsFile();
          if (f) uploadOne(f);
          return;
        }
      }
    });

    onSnapshot(imageRef, { includeMetadataChanges: false }, (snap) => {
      if (!snap.exists()) {
        showImage("");
        return;
      }
      const data = snap.data();
      if (!data || !data.base64) {
        showImage("");
        return;
      }
      if (data.base64 === currentSrc) return;
      showImage(data.base64);
    }, (err) => {
      console.error(err);
      showStatus("Firestore error — check Rules", true);
    });

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);
    canvas.addEventListener("wheel", onWheel, { passive: false });

    ["gesturestart", "gesturechange", "gestureend"].forEach((ev) => {
      document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    });

    preview.addEventListener("load", () => {
      redrawAll();
      for (const [uid, c] of remoteCursors) {
        const p = normToScreen(c.nx, c.ny);
        c.el.style.transition = "none";
        c.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
        void c.el.offsetWidth;
        c.el.style.transition = "";
      }
    });

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
  </script>
</body>
</html>
