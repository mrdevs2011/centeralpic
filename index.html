<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .zone {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
    }
    .zone.dragover {
      background: #141414;
    }
    .zone.dragover::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px dashed #404040;
      border-radius: 12px;
      pointer-events: none;
      z-index: 2;
      animation: pulseBorder 1s ease-in-out infinite;
    }
    @keyframes pulseBorder {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    #preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 0;
      filter: blur(32px) brightness(0.8);
      transform: scale(1.04);
      transition:
        opacity 0.08s linear,
        filter 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, filter, transform;
    }
    #preview.blur-in {
      opacity: 1;
      filter: blur(32px) brightness(0.8);
      transform: scale(1.04);
    }
    #preview.sharp {
      opacity: 1;
      filter: blur(0) brightness(1);
      transform: scale(1);
    }
    #preview.leaving {
      opacity: 0;
      filter: blur(20px);
      transform: scale(1.02);
      transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease;
    }
    .hint {
      color: #525252;
      font-size: 0.95rem;
      z-index: 1;
      pointer-events: none;
      letter-spacing: 0.02em;
      transition: opacity 0.25s ease, color 0.2s ease;
    }
    .zone.has-image .hint { opacity: 0; }
    .zone.dragover .hint { color: #a3a3a3; }
    .loader {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #333, #bbb, #333);
      background-size: 200% 100%;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .loader.active {
      opacity: 1;
      width: 100%;
      animation: shimmer 0.8s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    #fileInput { display: none; }
    .status {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      background: #1a1a1a;
      color: #d4d4d4;
      border: 1px solid #333;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10;
      pointer-events: none;
    }
    .status.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .status.error {
      background: #1c1010;
      color: #f87171;
      border-color: #7f1d1d;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      z-index: 3;
      display: block;
    }
    .cursor-preview {
      position: fixed;
      width: 28px;
      height: 28px;
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 30;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.6);
      opacity: 0.85;
      transition: all 0.03s linear;
      display: none;
    }
    .cursor-preview.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="zone" id="zone">
    <p class="hint">Drop or Ctrl+V</p>
    <img id="preview" src="" alt="">
    <input type="file" id="fileInput" accept="image/*">
    <canvas id="canvas"></canvas>
  </div>
  <div class="loader" id="loader"></div>
  <div class="status" id="status"></div>
  <div class="cursor-preview" id="cursorPreview"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      setDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBoyos6hb4yq8FKXRKAtpwERDh6agaF5VU",
      authDomain: "centeralpic.firebaseapp.com",
      projectId: "centeralpic",
      storageBucket: "centeralpic.firebasestorage.app",
      messagingSenderId: "294796721198",
      appId: "1:294796721198:web:ffb2bd139d31464687f3bf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const imageRef = doc(db, "app", "mainImage");

    const zone = document.getElementById("zone");
    const preview = document.getElementById("preview");
    const statusEl = document.getElementById("status");
    const loader = document.getElementById("loader");
    const canvas = document.getElementById("canvas");
    const cursorPreview = document.getElementById("cursorPreview");

    let currentSrc = "";
    let localToken = 0;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let lineWidth = 8;
    let currentColor = "#ff0000";

    function hexToRgb(hex) {
      let r = parseInt(hex.slice(1, 3), 16);
      let g = parseInt(hex.slice(3, 5), 16);
      let b = parseInt(hex.slice(5, 7), 16);
      return { r, g, b };
    }

    function showStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = "status show" + (isError ? " error" : "");
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => { statusEl.className = "status"; }, 1500);
    }

    function setLoader(on) {
      loader.classList.toggle("active", !!on);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function showImage(src) {
      if (!src) {
        preview.classList.remove("sharp", "blur-in");
        preview.classList.add("leaving");
        setTimeout(() => {
          preview.src = "";
          preview.classList.remove("leaving");
          zone.classList.remove("has-image");
          currentSrc = "";
        }, 200);
        return;
      }
      if (src === currentSrc) return;
      const reveal = () => {
        preview.src = src;
        currentSrc = src;
        zone.classList.add("has-image");
        preview.classList.remove("leaving", "sharp");
        preview.classList.add("blur-in");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            preview.classList.add("sharp");
          });
        });
      };
      if (preview.classList.contains("sharp") || preview.classList.contains("blur-in")) {
        preview.classList.remove("sharp", "blur-in");
        preview.classList.add("leaving");
        setTimeout(reveal, 180);
      } else {
        reveal();
      }
    }

    function drawLine(ctx, x0, y0, x1, y1) {
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }

    function addPixel(ctx, x, y) {
      const rgb = hexToRgb(currentColor);
      const alpha = 0.85 * 255;
      drawPixel(ctx, x, y, rgb, alpha);
    }

    function drawPixel(ctx, x, y, rgb, alpha) {
      const imageData = ctx.getImageData(x, y, 1, 1);
      const data = imageData.data;
      data[0] = rgb.r;
      data[1] = rgb.g;
      data[2] = rgb.b;
      data[3] = alpha;
      ctx.putImageData(imageData, x, y);
    }

    function addLine(ctx, x0, y0, x1, y1) {
      const rgb = hexToRgb(currentColor);
      const alpha = 0.85 * 255;
      const dx = x1 - x0;
      const dy = y1 - y0;
      const steps = Math.max(Math.abs(dx), Math.abs(dy));
      if (steps === 0) {
        addPixel(ctx, Math.floor(x0), Math.floor(y0));
        return;
      }
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = x0 + dx * t;
        const y = y0 + dy * t;
        addPixel(ctx, Math.floor(x), Math.floor(y));
      }
    }

    function updateCursorPosition(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      cursorPreview.style.left = `${x}px`;
      cursorPreview.style.top = `${y}px`;
    }

    function draw() {
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      drawLine(ctx, lastX, lastY, lastX + 6, lastY);
      lastX += 6;
      lastY += 6;
      updateCursorPosition({ clientX: lastX, clientY: lastY });
    }

    function startDrawing(e) {
      e.preventDefault();
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      lastX = e.clientX - rect.left;
      lastY = e.clientY - rect.top;
      const ctx = canvas.getContext("2d");
      if (ctx) {
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = currentColor;
      }
      draw();
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;
      const ctx = canvas.getContext("2d");
      if (ctx) ctx.stroke();
      lastX = 0;
      lastY = 0;
      updateCursorPosition({ clientX: 0, clientY: 0 });
    }

    function updateDrawing(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      lastX = e.clientX - rect.left;
      lastY = e.clientY - rect.top;
      const ctx = canvas.getContext("2d");
      if (ctx) {
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = currentColor;
        ctx.beginPath();
        ctx.moveTo(lastX - 6, lastY);
        ctx.lineTo(lastX, lastY);
        ctx.stroke();
      }
      updateCursorPosition(e);
    }

    async function uploadOne(file) {
      if (!file || !file.type || !file.type.startsWith("image/")) {
        showStatus("Only images", true);
        return;
      }
      if (file.size > 800 * 1024) {
        showStatus("Max 800 KB", true);
        return;
      }
      const token = ++localToken;
      try {
        setLoader(true);
        const base64 = await fileToBase64(file);
        showImage(base64);
        await setDoc(imageRef, {
          base64,
          name: file.name || "paste-" + Date.now() + ".png",
          type: file.type,
          size: file.size,
          updatedAt: serverTimestamp(),
          t: Date.now()
        });
        if (token === localToken) {
          setLoader(false);
          showStatus("Saved");
        }
      } catch (err) {
        console.error(err);
        if (token === localToken) {
          setLoader(false);
          showStatus(err.message || "Error", true);
        }
      }
    }

    function resizeCanvas() {
      const zoneRect = zone.getBoundingClientRect();
      canvas.width = zoneRect.width;
      canvas.height = zoneRect.height;
    }

    zone.addEventListener("dragover", (e) => {
      e.preventDefault();
      zone.classList.add("dragover");
    });
    zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("dragover");
      const f = e.dataTransfer.files[0];
      if (f) uploadOne(f);
    });
    document.addEventListener("paste", (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          e.preventDefault();
          const f = item.getAsFile();
          if (f) uploadOne(f);
          return;
        }
      }
    });

    onSnapshot(imageRef, { includeMetadataChanges: false }, (snap) => {
      if (!snap.exists()) {
        showImage("");
        return;
      }
      const data = snap.data();
      if (!data || !data.base64) {
        showImage("");
        return;
      }
      if (data.base64 === currentSrc) return;
      showImage(data.base64);
    }, (err) => {
      console.error(err);
      showStatus("Firestore error — check Rules", true);
    });

    canvas.addEventListener("pointerdown", startDrawing);
    canvas.addEventListener("pointermove", updateDrawing);
    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointerleave", stopDrawing);

    window.addEventListener("resize", resizeCanvas);

    function initCanvas() {
      resizeCanvas();
      updateCursorPosition({ clientX: 0, clientY: 0 });
    }

    initCanvas();
  </script>
</body>
</html>
