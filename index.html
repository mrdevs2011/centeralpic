<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>CenteralPIC</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 280 360'%3E%3Cpath d='M 0 0 L 260 180 L 120 210 L 0 330 Z' fill='%23ffffff'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none; overscroll-behavior: none;
    }
    .zone {
      width: 100%; height: 100%;
      position: relative;
      background: #0a0a0a;
      overflow: hidden;
      touch-action: none;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      z-index: 3;
      display: block;
      touch-action: none;
      cursor: none;
      opacity: 0;
      filter: blur(24px) brightness(0.8);
      transition: opacity 0.15s linear, filter 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #canvas.revealed { opacity: 1; filter: blur(0) brightness(1); }
    #canvas.clearing { opacity: 0; filter: blur(16px) brightness(0.7); transition: opacity 0.25s ease, filter 0.25s ease; }

    .remote-cursor {
      position: absolute;
      pointer-events: none;
      z-index: 25;
      opacity: 0;
      will-change: transform;
      left: 0;
      top: 0;
      width: 32px;
      height: 41px;
      transform-origin: 0 0;
      transition: opacity 150ms ease;
    }
    .remote-cursor.visible { opacity: 1; }
    .remote-cursor svg {
      width: 100%; height: 100%; display: block;
      filter: drop-shadow(0 0 3px rgba(0,0,0,0.7));
    }
  </style>
</head>
<body>
  <div class="zone" id="zone">
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <canvas id="canvas"></canvas>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getFirestore, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp, getDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
    import {
      getDatabase, ref, set as rtdbSet, update as rtdbUpdate,
      onValue, onChildAdded, onDisconnect, query, limitToLast, get
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    // ============================================================
    // CONFIG
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBoyos6hb4yq8FKXRKAtpwERDh6agaF5VU",
      authDomain: "centeralpic.firebaseapp.com",
      projectId: "centeralpic",
      storageBucket: "centeralpic.firebasestorage.app",
      messagingSenderId: "294796721198",
      appId: "1:294796721198:web:ffb2bd139d31464687f3bf",
      databaseURL: "https://centeralpic-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const ROOM = "centeralpic-main";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);
    const imageRef = doc(db, "app", "mainImage");
    const viewRef = doc(db, "app", "viewState");
    const strokesRoot = ref(rtdb, "strokes");

    // ============================================================
    // DOM
    // ============================================================
    const zone = document.getElementById("zone");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const fileInput = document.getElementById("fileInput");

    // ============================================================
    // IDENTITY — saqlanadi, refresh'da o'zgarmaydi
    // ============================================================
    let myId = localStorage.getItem("cp_id");
    if (!myId) {
      myId = Math.random().toString(36).slice(2, 10);
      localStorage.setItem("cp_id", myId);
    }

    // Har brauzer uchun bir marta rang — o'zgarmas
    let myColor = localStorage.getItem("cp_color");
    if (!myColor) {
      const h = Math.floor(Math.random() * 360);
      myColor = `hsl(${h}, 85%, 60%)`;
      localStorage.setItem("cp_color", myColor);
    }
    const currentColor = myColor;

    // ============================================================
    // STATE
    // ============================================================
    const LINE_WIDTHS = [2, 4, 6, 8, 12, 16, 24];
    let widthIndex = 3;
    function currentWidth() { return LINE_WIDTHS[widthIndex]; }

    let currentSrc = "";
    let localToken = 0;

    const image = new Image();
    image.crossOrigin = "anonymous";
    let imageReady = false;
    let imageMeta = null;

    // ============================================================
    // VIEW — nisbiy (ekran o'lchamidan mustaqil)
    // scale: rasm natural o'lchamiga nisbatan (1 = 1:1 piksel)
    // cx, cy: rasm markazining ekrandagi joyi (0..1)
    // ============================================================
    const view = { scale: 1, cx: 0.5, cy: 0.5, initialized: false };
    const MIN_SCALE = 0.05, MAX_SCALE = 32;
    let viewWriteTimer = null;

    let isSpaceDown = false;
    let isPanning = false;
    let panStartPointer = { x: 0, y: 0 };
    let panStartCx = 0.5, panStartCy = 0.5;

    let lastSentX = 0, lastSentY = 0;
    let lastPointerX = 0, lastPointerY = 0;

    const localSegments = new Map();
    const remoteCursors = new Map();

    const activePointers = new Map();
    let isDrawing = false;
    let pinchStartDist = 0, pinchStartScale = 1;
    let pinchStartCenter = { x: 0, y: 0 };
    let pinchStartCx = 0.5, pinchStartCy = 0.5;

    let canvasW = 0, canvasH = 0, dpr = 1;
    let lastDeleteTime = 0;
    const DELETE_DOUBLE_MS = 500;

    // ============================================================
    // TRANSPORT: BroadcastChannel + WebRTC + RTDB
    // ============================================================
    const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("centeralpic-" + ROOM) : null;
    if (bc) {
      bc.onmessage = (e) => {
        const msg = e.data;
        if (!msg || msg.from === myId) return;
        handleMessage(msg.from, msg);
      };
    }

    const peers = new Map();
    const handledSdp = new Set();
    const handledIce = new Set();

    const ICE = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:global.stun.twilio.com:3478" }
      ]
    };

    function createPeer(remoteId, initiator) {
      if (peers.has(remoteId)) return peers.get(remoteId);
      const pc = new RTCPeerConnection(ICE);
      const entry = { pc, dc: null, connected: false, created: Date.now() };
      peers.set(remoteId, entry);

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          const path = `signaling/${ROOM}/${remoteId}/ice/${myId}/${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
          rtdbSet(ref(rtdb, path), e.candidate.toJSON()).catch(() => {});
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed" || pc.connectionState === "closed") cleanupPeer(remoteId);
      };
      pc.ondatachannel = (e) => setupDataChannel(remoteId, e.channel);

      if (initiator) {
        const dc = pc.createDataChannel("d", { ordered: false, maxRetransmits: 0 });
        setupDataChannel(remoteId, dc);
        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer))
          .then(() => {
            const path = `signaling/${ROOM}/${remoteId}/sdp/${myId}`;
            rtdbSet(ref(rtdb, path), { type: pc.localDescription.type, sdp: pc.localDescription.sdp }).catch(() => {});
          })
          .catch(() => cleanupPeer(remoteId));
      }
      return entry;
    }

    function setupDataChannel(remoteId, dc) {
      const entry = peers.get(remoteId);
      if (!entry) return;
      entry.dc = dc;
      dc.binaryType = "arraybuffer";
      dc.onopen = () => { entry.connected = true; };
      dc.onclose = () => { entry.connected = false; };
      dc.onmessage = (e) => {
        try { handleMessage(remoteId, JSON.parse(e.data)); } catch (err) {}
      };
    }

    function cleanupPeer(remoteId) {
      const entry = peers.get(remoteId);
      if (!entry) return;
      try { entry.dc && entry.dc.close(); } catch (e) {}
      try { entry.pc.close(); } catch (e) {}
      peers.delete(remoteId);
      rtdbSet(ref(rtdb, `signaling/${ROOM}/${remoteId}`), null).catch(() => {});
    }

    async function handleRemoteSdp(fromId, sdp) {
      const key = fromId + ":" + sdp.type + ":" + (sdp.sdp || "").slice(0, 40);
      if (handledSdp.has(key)) return;
      handledSdp.add(key);
      let entry = peers.get(fromId);
      if (!entry) entry = createPeer(fromId, false);
      const pc = entry.pc;
      try {
        if (sdp.type === "offer") {
          await pc.setRemoteDescription(new RTCSessionDescription(sdp));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          const path = `signaling/${ROOM}/${fromId}/sdp/${myId}`;
          await rtdbSet(ref(rtdb, path), { type: answer.type, sdp: answer.sdp });
        } else if (sdp.type === "answer") {
          if (pc.signalingState === "have-local-offer") {
            await pc.setRemoteDescription(new RTCSessionDescription(sdp));
          }
        }
      } catch (err) {}
    }

    async function handleRemoteIce(fromId, cand, cid) {
      const key = fromId + ":" + cid;
      if (handledIce.has(key)) return;
      handledIce.add(key);
      let entry = peers.get(fromId);
      if (!entry) entry = createPeer(fromId, false);
      try { await entry.pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (err) {}
    }

    onValue(ref(rtdb, `signaling/${ROOM}/${myId}`), (snap) => {
      const data = snap.val();
      if (!data) return;
      const sdpRoot = data.sdp || {};
      for (const fromId in sdpRoot) {
        if (fromId === myId) continue;
        const sdp = sdpRoot[fromId];
        if (sdp && sdp.type) handleRemoteSdp(fromId, sdp);
      }
      const iceRoot = data.ice || {};
      for (const fromId in iceRoot) {
        if (fromId === myId) continue;
        const cands = iceRoot[fromId] || {};
        for (const cid in cands) handleRemoteIce(fromId, cands[cid], cid);
      }
    });

    onChildAdded(ref(rtdb, `signaling/${ROOM}/peers`), (child) => {
      const otherId = child.key;
      if (otherId === myId) return;
      createPeer(otherId, myId < otherId);
    });

    rtdbSet(ref(rtdb, `signaling/${ROOM}/peers/${myId}`), { t: Date.now() }).catch(() => {});
    onDisconnect(ref(rtdb, `signaling/${ROOM}/peers/${myId}`)).remove();
    onDisconnect(ref(rtdb, `signaling/${ROOM}/${myId}`)).remove();

    setInterval(() => {
      const now = Date.now();
      for (const [id, e] of peers) {
        if (!e.connected && now - e.created > 20000) cleanupPeer(id);
      }
    }, 5000);

    // ============================================================
    // SEND — 3 transportga bir vaqtda
    // ============================================================
    function send(msg) {
      msg.from = myId;
      if (bc) { try { bc.postMessage(msg); } catch (e) {} }
      const str = JSON.stringify(msg);
      for (const [id, p] of peers) {
        if (p.dc && p.dc.readyState === "open") {
          try { p.dc.send(str); } catch (e) {}
        }
      }
    }

    // ============================================================
    // MESSAGE HANDLER
    // ============================================================
    function handleMessage(fromId, msg) {
      if (!msg || fromId === myId) return;
      switch (msg.t) {
        case "s": {
          const s = msg.s;
          if (!s || localSegments.has(s.id)) return;
          localSegments.set(s.id, s);
          drawSegmentNorm(s);
          scheduleStrokePersist(s);
          break;
        }
        case "u": {
          if (Array.isArray(msg.ids)) {
            for (const id of msg.ids) localSegments.delete(id);
            redrawAll();
          }
          break;
        }
        case "c": {
          localSegments.clear();
          redrawAll();
          break;
        }
        case "v": {
          if (
            Math.abs(msg.scale - view.scale) < 0.0001 &&
            Math.abs(msg.cx - view.cx) < 0.0001 &&
            Math.abs(msg.cy - view.cy) < 0.0001
          ) return;
          view.scale = msg.scale;
          view.cx = msg.cx;
          view.cy = msg.cy;
          view.initialized = true;
          applyView();
          break;
        }
        case "p": {
          placeRemoteCursor(fromId, msg.x, msg.y);
          break;
        }
      }
    }

    // Stroke persistence (RTDB)
    let strokePersistQueue = [];
    let strokePersistTimer = null;
    function scheduleStrokePersist(s) {
      strokePersistQueue.push(s);
      if (strokePersistTimer) return;
      strokePersistTimer = setTimeout(flushStrokePersist, 200);
    }
    async function flushStrokePersist() {
      strokePersistTimer = null;
      const batch = strokePersistQueue.splice(0);
      if (!batch.length) return;
      const updates = {};
      for (const s of batch) updates["strokes/" + s.id] = s;
      try { await rtdbUpdate(ref(rtdb), updates); } catch (e) {}
    }

    // ============================================================
    // GEOMETRY — nisbiy view
    // ============================================================
    function getImageNatural() {
      return {
        w: image.naturalWidth || 1,
        h: image.naturalHeight || 1
      };
    }

    function getImageScreenRect() {
      const { w: nW, h: nH } = getImageNatural();
      const cxp = view.cx * canvasW;
      const cyp = view.cy * canvasH;
      const w = nW * view.scale;
      const h = nH * view.scale;
      return { left: cxp - w / 2, top: cyp - h / 2, width: w, height: h };
    }

    function screenToNorm(px, py) {
      const r = getImageScreenRect();
      return {
        x: (px - r.left) / r.width,
        y: (py - r.top) / r.height
      };
    }

    function normToScreen(nx, ny) {
      const r = getImageScreenRect();
      return {
        x: r.left + nx * r.width,
        y: r.top + ny * r.height
      };
    }

    function applyView() {
      redrawAll();
      for (const [uid, c] of remoteCursors) {
        const p = normToScreen(c.nx, c.ny);
        c.el.style.transition = "none";
        c.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
        void c.el.offsetWidth;
        c.el.style.transition = "";
      }
    }

    // ============================================================
    // VIEW PERSISTENCE — Firestore
    // ============================================================
    function queueViewWrite() {
      if (viewWriteTimer) return;
      viewWriteTimer = setTimeout(async () => {
        viewWriteTimer = null;
        try {
          await setDoc(viewRef, {
            scale: +view.scale.toFixed(6),
            cx: +view.cx.toFixed(6),
            cy: +view.cy.toFixed(6),
            t: Date.now(),
            updatedAt: serverTimestamp()
          });
        } catch (e) {}
      }, 300);
    }

    async function loadViewFromFirestore() {
      try {
        const snap = await getDoc(viewRef);
        if (!snap.exists()) return false;
        const v = snap.data();
        if (typeof v.scale !== "number") return false;
        view.scale = v.scale;
        view.cx = v.cx ?? 0.5;
        view.cy = v.cy ?? 0.5;
        view.initialized = true;
        return true;
      } catch (e) { return false; }
    }

    function broadcastView() {
      send({
        t: "v",
        scale: +view.scale.toFixed(6),
        cx: +view.cx.toFixed(6),
        cy: +view.cy.toFixed(6)
      });
      queueViewWrite();
    }

    // ============================================================
    // VIEW OPERATIONS
    // ============================================================
    function zoomAt(px, py, newScale, sync = true) {
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      const r = getImageScreenRect();
      const nx = (px - r.left) / r.width;
      const ny = (py - r.top) / r.height;

      const { w: nW, h: nH } = getImageNatural();
      const newW = nW * newScale;
      const newH = nH * newScale;

      const newLeft = px - nx * newW;
      const newTop = py - ny * newH;

      view.scale = newScale;
      view.cx = (newLeft + newW / 2) / canvasW;
      view.cy = (newTop + newH / 2) / canvasH;
      view.initialized = true;

      applyView();
      if (sync) broadcastView();
    }

    function resetView(sync = true) {
      const { w: nW, h: nH } = getImageNatural();
      const fitScale = Math.min(canvasW / nW, canvasH / nH) * 0.95;
      view.scale = fitScale;
      view.cx = 0.5;
      view.cy = 0.5;
      view.initialized = true;
      applyView();
      if (sync) broadcastView();
    }

    function panBy(dx, dy, sync = true) {
      view.cx += dx / canvasW;
      view.cy += dy / canvasH;
      applyView();
      if (sync) broadcastView();
    }

    // ============================================================
    // CURSOR — to'ldirilgan uchburchak, uchi (0,0)
    // ============================================================
    const CURSOR_SVG_NS = "http://www.w3.org/2000/svg";
    const CURSOR_PATH_D = "M 0 0 L 260 180 L 120 210 L 0 330 Z";
    const CURSOR_VB_W = 280;
    const CURSOR_VB_H = 360;

    function makeCursorSvg() {
      const svg = document.createElementNS(CURSOR_SVG_NS, "svg");
      svg.setAttribute("viewBox", `0 0 ${CURSOR_VB_W} ${CURSOR_VB_H}`);
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      const path = document.createElementNS(CURSOR_SVG_NS, "path");
      path.setAttribute("d", CURSOR_PATH_D);
      path.setAttribute("fill", "currentColor");
      svg.appendChild(path);
      return svg;
    }

    function pickColor(seed) {
      let h = 0;
      for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 360;
      return `hsl(${h}, 85%, 60%)`;
    }

    function ensureRemoteCursor(uid) {
      let c = remoteCursors.get(uid);
      if (c) return c;
      const color = pickColor(uid);
      const el = document.createElement("div");
      el.className = "remote-cursor";
      el.style.color = color;
      el.appendChild(makeCursorSvg());
      zone.appendChild(el);
      c = { el, nx: 0, ny: 0, t: 0 };
      remoteCursors.set(uid, c);
      return c;
    }

    function placeRemoteCursor(uid, nx, ny) {
      const c = ensureRemoteCursor(uid);
      c.nx = nx; c.ny = ny; c.t = Date.now();
      const p = normToScreen(nx, ny);
      c.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      c.el.classList.add("visible");
    }

    function removeRemoteCursor(uid) {
      const c = remoteCursors.get(uid);
      if (!c) return;
      c.el.remove();
      remoteCursors.delete(uid);
    }

    setInterval(() => {
      const now = Date.now();
      for (const [uid, c] of remoteCursors) {
        if (now - c.t > 5000) removeRemoteCursor(uid);
      }
    }, 2000);

    // ============================================================
    // DRAW
    // ============================================================
    function drawImage() {
      if (!imageReady) return;
      const r = getImageScreenRect();
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, canvasW, canvasH);
      ctx.clip();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(image, r.left, r.top, r.width, r.height);
      ctx.restore();
    }

    function drawSegmentNorm(s) {
      const a = normToScreen(s.x0, s.y0);
      const b = normToScreen(s.x1, s.y1);
      ctx.strokeStyle = s.c;
      ctx.lineWidth = s.w * view.scale;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    function redrawAll() {
      ctx.clearRect(0, 0, canvasW, canvasH);
      drawImage();
      for (const s of localSegments.values()) drawSegmentNorm(s);
    }

    // ============================================================
    // IMAGE
    // ============================================================
    function showImage(src) {
      if (!src) {
        imageReady = false;
        currentSrc = "";
        imageMeta = null;
        canvas.classList.remove("revealed");
        canvas.classList.add("clearing");
        setTimeout(() => {
          if (!imageReady) { canvas.classList.remove("revealed", "clearing"); redrawAll(); }
        }, 300);
        return;
      }
      if (src === currentSrc && imageReady) return;
      canvas.classList.remove("revealed", "clearing");
      imageReady = false;
      currentSrc = src;
      image.onload = () => {
        imageReady = true;
        if (!view.initialized) {
          resetView(true);
        } else {
          applyView();
        }
        requestAnimationFrame(() => requestAnimationFrame(() => canvas.classList.add("revealed")));
      };
      image.onerror = () => { imageReady = false; redrawAll(); };
      image.src = src;
    }

    onSnapshot(imageRef, { includeMetadataChanges: false }, (snap) => {
      if (!snap.exists()) { showImage(""); return; }
      const data = snap.data();
      if (!data || !data.base64) { showImage(""); return; }
      imageMeta = { name: data.name, size: data.size, type: data.type };
      if (data.base64 === currentSrc && imageReady) return;
      showImage(data.base64);
    }, (err) => {});

    // View Firestore'dan — refresh bo'lsa ham bir xil
    onSnapshot(viewRef, { includeMetadataChanges: false }, (snap) => {
      if (!snap.exists()) return;
      const v = snap.data();
      if (typeof v.scale !== "number") return;
      if (
        Math.abs(v.scale - view.scale) < 0.0001 &&
        Math.abs(v.cx - view.cx) < 0.0001 &&
        Math.abs(v.cy - view.cy) < 0.0001
      ) return;
      view.scale = v.scale;
      view.cx = v.cx ?? 0.5;
      view.cy = v.cy ?? 0.5;
      view.initialized = true;
      applyView();
    }, (err) => {});

    // ============================================================
    // POINTER
    // ============================================================
    function getPinchCenter() {
      const pts = Array.from(activePointers.values());
      return { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    }
    function getPinchDist() {
      const pts = Array.from(activePointers.values());
      return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }

    function onPointerDown(e) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      activePointers.set(e.pointerId, { x: px, y: py });

      if (isSpaceDown || e.button === 1) {
        isPanning = true; isDrawing = false;
        panStartPointer = { x: px, y: py };
        panStartCx = view.cx;
        panStartCy = view.cy;
        return;
      }

      if (activePointers.size === 1) {
        isDrawing = true;
        const n = screenToNorm(px, py);
        lastSentX = n.x; lastSentY = n.y;
        lastPointerX = n.x; lastPointerY = n.y;
        send({ t: "p", x: n.x, y: n.y });
      } else if (activePointers.size === 2) {
        isDrawing = false; isPanning = true;
        pinchStartDist = getPinchDist();
        pinchStartScale = view.scale;
        pinchStartCenter = getPinchCenter();
        pinchStartCx = view.cx;
        pinchStartCy = view.cy;
      }
    }

    function onPointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;

      if (!activePointers.has(e.pointerId)) {
        const n = screenToNorm(px, py);
        send({ t: "p", x: n.x, y: n.y });
        return;
      }
      activePointers.set(e.pointerId, { x: px, y: py });

      if (isPanning && activePointers.size === 1) {
        const dx = px - panStartPointer.x;
        const dy = py - panStartPointer.y;
        view.cx = panStartCx + dx / canvasW;
        view.cy = panStartCy + dy / canvasH;
        view.initialized = true;
        applyView();
        broadcastView();
        return;
      }

      if (activePointers.size >= 2) {
        const dist = getPinchDist();
        if (pinchStartDist > 0) {
          const ratio = dist / pinchStartDist;
          let newScale = pinchStartScale * ratio;
          newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));

          const { w: nW, h: nH } = getImageNatural();
          const center = getPinchCenter();

          const startLeft = pinchStartCx * canvasW - (nW * pinchStartScale) / 2;
          const startTop = pinchStartCy * canvasH - (nH * pinchStartScale) / 2;
          const nx = (pinchStartCenter.x - startLeft) / (nW * pinchStartScale);
          const ny = (pinchStartCenter.y - startTop) / (nH * pinchStartScale);

          const newLeft = center.x - nx * nW * newScale;
          const newTop = center.y - ny * nH * newScale;

          view.scale = newScale;
          view.cx = (newLeft + (nW * newScale) / 2) / canvasW;
          view.cy = (newTop + (nH * newScale) / 2) / canvasH;
          view.initialized = true;
          applyView();
          broadcastView();
        }
        return;
      }

      if (activePointers.size === 1 && isDrawing) {
        const n = screenToNorm(px, py);
        send({ t: "p", x: n.x, y: n.y });

        const r = getImageScreenRect();
        const dxPx = (n.x - lastPointerX) * r.width;
        const dyPx = (n.y - lastPointerY) * r.height;
        if (dxPx * dxPx + dyPx * dyPx < 4) return;

        const a = normToScreen(lastPointerX, lastPointerY);
        const b = normToScreen(n.x, n.y);
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentWidth() * view.scale;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();

        const id = "s_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6);
        const s = {
          id,
          x0: +lastSentX.toFixed(6),
          y0: +lastSentY.toFixed(6),
          x1: +n.x.toFixed(6),
          y1: +n.y.toFixed(6),
          c: currentColor,
          w: currentWidth(),
          u: myId,
          t: Date.now()
        };
        localSegments.set(id, s);
        send({ t: "s", s });

        lastPointerX = n.x; lastPointerY = n.y;
        lastSentX = n.x; lastSentY = n.y;
      }
    }

    function onPointerUp(e) {
      activePointers.delete(e.pointerId);
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      if (activePointers.size === 0) {
        isDrawing = false; isPanning = false;
        pinchStartDist = 0;
      } else if (activePointers.size === 1) {
        isDrawing = false; isPanning = false;
        pinchStartDist = 0;
      }
    }

    function onWheel(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      if (e.ctrlKey) {
        const factor = Math.exp(-e.deltaY * 0.01);
        zoomAt(px, py, view.scale * factor);
      } else {
        panBy(-e.deltaX, -e.deltaY);
      }
    }

    // ============================================================
    // GLOBAL UNDO
    // ============================================================
    let undoLock = false;
    async function globalUndo() {
      if (undoLock) return;
      undoLock = true;
      try {
        const q = query(strokesRoot, limitToLast(2000));
        const snap = await get(q);
        if (!snap.exists()) { undoLock = false; return; }
        const arr = [];
        snap.forEach((child) => arr.push({ id: child.key, ...child.val() }));
        if (!arr.length) { undoLock = false; return; }

        const last = arr[arr.length - 1];
        const batch = [last];
        const cutoff = (last.t || Date.now()) - 700;
        for (let i = arr.length - 2; i >= 0; i--) {
          const s = arr[i];
          if (s.u !== last.u) break;
          if ((s.t || 0) < cutoff) break;
          batch.push(s);
        }

        const ids = batch.map((b) => b.id);
        for (const id of ids) localSegments.delete(id);
        redrawAll();

        send({ t: "u", ids });
        const updates = {};
        for (const id of ids) updates["strokes/" + id] = null;
        rtdbUpdate(ref(rtdb), updates).catch(() => {});
      } catch (err) {}
      undoLock = false;
    }

    // ============================================================
    // CLEAR
    // ============================================================
    function clearStrokes() {
      localSegments.clear();
      redrawAll();
      send({ t: "c" });
      rtdbSet(strokesRoot, null).catch(() => {});
    }

    async function clearImage() {
      try { await deleteDoc(imageRef); } catch (e) {}
      clearStrokes();
      resetView(true);
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function setLoader(on) {}

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    // ============================================================
    // UPLOAD
    // ============================================================
    async function uploadOne(file) {
      if (!file || !file.type || !file.type.startsWith("image/")) return;
      if (file.size > 800 * 1024) return;
      const token = ++localToken;
      try {
        const base64 = await fileToBase64(file);
        showImage(base64);
        await setDoc(imageRef, {
          base64,
          name: file.name || "paste-" + Date.now() + ".png",
          type: file.type,
          size: file.size,
          updatedAt: serverTimestamp(),
          t: Date.now()
        });
        imageMeta = { name: file.name || "pasted", size: file.size };
        clearStrokes();
        resetView(true);
      } catch (err) {
        console.error(err);
      }
    }

    // ============================================================
    // RESIZE
    // ============================================================
    function resizeCanvas() {
      const r = zone.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      canvasW = r.width; canvasH = r.height;
      canvas.width = Math.floor(canvasW * dpr);
      canvas.height = Math.floor(canvasH * dpr);
      canvas.style.width = canvasW + "px";
      canvas.style.height = canvasH + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      applyView();
    }

    // ============================================================
    // EVENTS
    // ============================================================
    zone.addEventListener("dragover", (e) => e.preventDefault());
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (f) uploadOne(f);
    });

    document.addEventListener("paste", (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          e.preventDefault();
          const f = item.getAsFile();
          if (f) uploadOne(f);
          return;
        }
      }
    });

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);
    canvas.addEventListener("wheel", onWheel, { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    ["gesturestart", "gesturechange", "gestureend"].forEach((ev) => {
      document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    });

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("beforeunload", () => {
      if (bc) bc.close();
    });

    // ============================================================
    // KEYBOARD
    // ============================================================
    document.addEventListener("keydown", (e) => {
      const t = document.activeElement && document.activeElement.tagName;
      if (t === "INPUT" || t === "TEXTAREA") {
        if (e.key === "Escape") document.activeElement.blur();
        return;
      }

      const cmd = e.ctrlKey || e.metaKey;
      const k = e.key;

      if (k === "Escape") {
        if (isDrawing) { isDrawing = false; return; }
        return;
      }
      if (k === " ") {
        isSpaceDown = true;
        e.preventDefault();
        return;
      }
      if (cmd && (k === "z" || k === "Z") && !e.shiftKey) {
        e.preventDefault(); globalUndo(); return;
      }
      if (cmd && k === "0") { e.preventDefault(); resetView(true); return; }
      if (cmd && (k === "+" || k === "=")) {
        e.preventDefault(); zoomAt(canvasW / 2, canvasH / 2, view.scale * 1.25); return;
      }
      if (cmd && (k === "-" || k === "_")) {
        e.preventDefault(); zoomAt(canvasW / 2, canvasH / 2, view.scale / 1.25); return;
      }
      if (k === "Delete") {
        e.preventDefault();
        const now = Date.now();
        if (now - lastDeleteTime < DELETE_DOUBLE_MS) {
          lastDeleteTime = 0; clearImage();
        } else {
          lastDeleteTime = now;
        }
        return;
      }
      if (k === "Backspace") { e.preventDefault(); globalUndo(); return; }
      if (!cmd && (k === "c" || k === "C")) { e.preventDefault(); clearStrokes(); return; }
      if (k === "[") {
        e.preventDefault();
        widthIndex = Math.max(0, widthIndex - 1);
        return;
      }
      if (k === "]") {
        e.preventDefault();
        widthIndex = Math.min(LINE_WIDTHS.length - 1, widthIndex + 1);
        return;
      }
      if (!cmd && (k === "o" || k === "O")) { e.preventDefault(); fileInput.click(); return; }
      if (!cmd && (k === "f" || k === "F")) {
        e.preventDefault();
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
        return;
      }
      if (k === "1") { e.preventDefault(); resetView(true); return; }
      if (k === "2") { e.preventDefault(); zoomAt(canvasW / 2, canvasH / 2, 2); return; }

      const panStep = e.shiftKey ? 100 : 30;
      if (k === "ArrowLeft") { e.preventDefault(); panBy(panStep, 0); return; }
      if (k === "ArrowRight") { e.preventDefault(); panBy(-panStep, 0); return; }
      if (k === "ArrowUp") { e.preventDefault(); panBy(0, panStep); return; }
      if (k === "ArrowDown") { e.preventDefault(); panBy(0, -panStep); return; }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === " ") { isSpaceDown = false; }
    });
    window.addEventListener("blur", () => {
      isSpaceDown = false;
    });

    fileInput.addEventListener("change", () => {
      const f = fileInput.files[0];
      if (f) uploadOne(f);
      fileInput.value = "";
    });

    // ============================================================
    // INIT
    // ============================================================
    resizeCanvas();

    // View'ni Firestore'dan yuklash (rasm yuklanishidan oldin)
    (async () => {
      await loadViewFromFirestore();
      if (view.initialized) applyView();
    })();
  </script>
</body>
